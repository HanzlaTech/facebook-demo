<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>
<body>
    <label>Email:</label>
    <input type="email" placeholder="Enter email" id="email" autocomplete="">
     <label>Password:</label>
    <input type="password" placeholder="Enter password" id="password"autocomplete="new-password">
     <label>Date of birth:</label>
    <input type="date" id="birth" >
 <label>Profile:</label>
    <input type="file" id="file" >
    <button id="signup" >Signup</button>
    <script src="../script/signup.js"></script>
</body>
</html>
